# ==============================================================================
# ROV Physical & Hydrodynamic Configuration
# Compatible with ArduSub Parameters & Fossen 6-DOF Dynamics
# ==============================================================================

# --- 1. Vehicle Rigid-Body Parameters (Body-fixed Frame) ---
vehicle:
  name: "Custom_Team_ROV"
  mass: 11.5                            # Dry vehicle mass [kg]
  volume: 0.0116                        # Displaced water volume [m^3] (~11.89 kg buoyant in seawater)
  center_of_gravity: [0.0, 0.0, 0.02]   # r_G = [x_G, y_G, z_G] in Body frame [m] (CoG slightly below origin)
  center_of_buoyancy: [0.0, 0.0, -0.02] # r_B = [x_B, y_B, z_B] in Body frame [m] (CoB slightly above origin)
  inertia_tensor:                       # Rigid-body moment of inertia [kg*m^2]
    Ixx: 0.16
    Iyy: 0.35
    Izz: 0.35
    Ixy: 0.0
    Ixz: 0.0
    Iyz: 0.0

# --- 2. Hydrodynamic Derivatives (Fossen Marine Craft Standard) ---
# Các tham số này có thể tính toán qua CAD hoặc cho tàu 
hydrodynamics:
  # Diagonal Added Mass (M_A) [kg, kg*m^2]
  added_mass_diagonal:
    X_udot: 5.5   # Surge added mass
    Y_vdot: 8.0   # Sway added mass
    Z_wdot: 14.6  # Heave added mass
    K_pdot: 0.05  # Roll added mass
    M_qdot: 0.12  # Pitch added mass
    N_rdot: 0.12  # Yaw added mass

  # Linear Damping (D_l: skin friction) [Ns/m, Nms/rad]
  linear_damping:
    Xu: 4.03
    Yv: 6.22
    Zw: 11.17
    Kp: 0.07
    Mq: 0.07
    Nr: 0.07

  # Quadratic Damping (D_q: form drag) [Ns^2/m^2, Nms^2/rad^2]
  quadratic_damping:
    Xuu: 18.18
    Yvv: 21.66
    Zww: 36.99
    Kpp: 1.55
    Mqq: 1.55
    Nrr: 1.55

# --- 3. ArduSub Compatible Parameters (AP_Motors6DOF & Sensors) ---
ardusub:
  frame_type: "CUSTOM_3THRUSTER"        # Framework config (e.g. CUSTOM_3THRUSTER, VECTORED, VECTORED_6DOF)
  pwm_limits:
    min: 1100                           # MOT_PWM_MIN [us]
    max: 1900                           # MOT_PWM_MAX [us]
    trim: 1500                          # MOT_PWM_TRIM [us]
    deadband: 25                        # Deadband around neutral [us]

  # IMU lever arms relative to CoM (corresponds to ArduSub INS_POS1_X/Y/Z)
  imu_lever_arms:
    imu1: [-0.18,  0.11,  0.04]        # Front-left IMU [m]
    imu2: [ 0.18,  0.11,  0.04]        # Front-right IMU [m]
    imu3: [-0.18, -0.11,  0.04]        # Rear-left IMU [m]
    imu4: [ 0.18, -0.11,  0.04]        # Rear-right IMU [m]
    imu5: [ 0.00,  0.00,  0.00]        # CoM center IMU [m]

  # Thrusters layout with positions, directions, and ArduSub motor factors
  # Motor factors correspond to rows of thruster allocation matrix B:
  # [forward = Surge, strafe = Sway, throttle = -Heave, roll = Roll, pitch = Pitch, yaw = Yaw]
  thrusters:

    - name: "thruster_left"
      position: [-0.15, -0.12, 0.0]     # [x, y, z] in body frame [m]
      direction: [1.0, 0.0, 0.0]        # Unit vector (+x forward)
      ardusub_factors:
        forward: 1.0
        strafe: 0.0
        throttle: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.12                       # Moment arm d_y = 0.12 m
    - name: "thruster_right"
      position: [-0.15, 0.12, 0.0]
      direction: [1.0, 0.0, 0.0]        # Unit vector (+x forward)
      ardusub_factors:
        forward: 1.0
        strafe: 0.0
        throttle: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: -0.12                      # Moment arm -d_y = -0.12 m
    - name: "thruster_vertical"
      position: [0.0, 0.0, 0.0]
      direction: [0.0, 0.0, -1.0]       # Unit vector (-z upwards)
      ardusub_factors:
        forward: 0.0
        strafe: 0.0
        throttle: 1.0                   # ArduSub throttle +1 pushes UP (-z in NED)
        roll: 0.0
        pitch: 0.0
        yaw: 0.0

# --- 4. Degree of Freedom (DOF) Reduction Configuration ---
dof_config:
  preset: "ROV_3DOF_SURGE_HEAVE_YAW"    # FULL_6DOF, ROV_3DOF_SURGE_HEAVE_YAW, PLANAR_3DOF, ROV_4DOF, CUSTOM
  active_dofs:
    - "SURGE"
    - "HEAVE"
    - "YAW"

# --- 5. NED Global Environment Parameters ---
# Defined in Earth-fixed North-East-Down {n} frame
ned_environment:
  gravity: 9.80665                      # Acceleration due to gravity [m/s^2] (+z down)
  fluid_density: 1025.0                 # Seawater density [kg/m^3] (1000.0 for freshwater)
  surface_atmospheric_pressure: 101325  # Surface atmospheric pressure [Pa]
  nominal_ocean_current: [0.0, 0.0, 0.0]# Ocean current [v_cN, v_cE, v_cD] [m/s] in NED
